services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orgchart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orgchart}
      POSTGRES_DB: ${POSTGRES_DB:-orgchart}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orgchart} -d ${POSTGRES_DB:-orgchart}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  # Ephemeral test database for `apps/api` feature tests. Not part of the default
  # `docker compose up`; start explicitly with `docker compose up -d db-test`.
  # Data lives on tmpfs (no named volume) so it never survives a container restart.
  db-test:
    image: postgres:16
    restart: "no"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-orgchart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orgchart}
      POSTGRES_DB: ${TEST_POSTGRES_DB:-orgchart_test}
    ports:
      - "${TEST_POSTGRES_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-orgchart} -d ${TEST_POSTGRES_DB:-orgchart_test}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://orgchart:orgchart@db:5432/orgchart}
      API_PORT: ${API_PORT:-3000}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://web:${WEB_PORT:-5173}}
    ports:
      - "${API_PORT:-3000}:${API_PORT:-3000}"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      WEB_PORT: ${WEB_PORT:-5173}
      API_PORT: ${API_PORT:-3000}
      API_HOST: api
    ports:
      - "${WEB_PORT:-5173}:${WEB_PORT:-5173}"
    depends_on:
      - api

volumes:
  db-data:
